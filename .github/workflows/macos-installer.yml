name: macOS installer and manager
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft or published release containing the matching signed envelope and assets'
        required: false
        type: string
      full_payload:
        description: 'Download and install full world ZIPs (false tests draft access and signed catalog only)'
        required: false
        type: boolean
        default: true
  push:
    branches: [codex/macos-installer]
    paths: ['open-world-platform/native/**', '.github/workflows/macos-installer.yml', 'VERSION']
  pull_request:
    paths: ['open-world-platform/native/**', '.github/workflows/macos-installer.yml', 'VERSION']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check workspace capacity
        run: df -h "$RUNNER_TEMP"
      - name: Download candidate release assets
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FULL_PAYLOAD: ${{ inputs.full_payload }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "$FULL_PAYLOAD" = true ]; then
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          else
            gh release download "$RELEASE_TAG" --pattern release-envelope.json --dir "$RUNNER_TEMP/release-assets"
          fi
          cp "$RUNNER_TEMP/release-assets/release-envelope.json" open-world-platform/native/src/OpenWorld.MacBackend/release-envelope.json
      - name: Build native manager and DMG
        run: bash open-world-platform/native/macos/build-manager.sh '${{ matrix.rid }}' "$RUNNER_TEMP/manager-build"
      - name: Mount DMG and install app copy
        run: |
          mkdir -p "$RUNNER_TEMP/mounted" "$HOME/Applications" artifacts/screenshots
          hdiutil attach "$RUNNER_TEMP/manager-build/"*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/mounted"
          test "$(readlink "$RUNNER_TEMP/mounted/Applications")" = /Applications
          ditto "$RUNNER_TEMP/mounted/Open World Manager.app" "$HOME/Applications/Open World Manager.app"
          hdiutil detach "$RUNNER_TEMP/mounted"
          cp "$RUNNER_TEMP/manager-build/"*.dmg artifacts/
      - name: Installer safety and server lifecycle tests
        run: dotnet run --project open-world-platform/native/tests/OpenWorld.Mac.Tests -c Release -- "$HOME/Applications/Open World Manager.app/Contents/MacOS/open-world-tile-server"
      - name: Real NEC and Japan release install smoke
        if: inputs.release_tag != '' && inputs.full_payload
        env:
          OPEN_WORLD_RELEASE_ASSET_ROOT: ${{ runner.temp }}/release-assets
        run: dotnet run --project open-world-platform/native/tests/OpenWorld.Mac.Tests -c Release -- "$HOME/Applications/Open World Manager.app/Contents/MacOS/open-world-tile-server" --full-release
      - name: Live UI backend integration
        env:
          UI_SNAPSHOT_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$HOME/Applications/Open World Manager.app/Contents/MacOS/OpenWorldManager" --ui-smoke > artifacts/ui-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do
            test -f "$UI_SNAPSHOT_ROOT/ui-smoke-passed" && break
            sleep 1
          done
          cat "$UI_SNAPSHOT_ROOT/ui-smoke-passed"
          sleep 1
          screencapture -x -o -l "$(cat "$UI_SNAPSHOT_ROOT/live-window-id")" artifacts/screenshots/live-catalog.png
      - name: Capture every interface
        if: always()
        env:
          UI_SNAPSHOT_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots
          app="$HOME/Applications/Open World Manager.app/Contents/MacOS/OpenWorldManager"
          for state in installer progress cancel complete manager error uninstall; do
            rm -f "$UI_SNAPSHOT_ROOT/window-id"
            "$app" --snapshot "$state" > "artifacts/$state.log" 2>&1 &
            pid=$!
            for i in $(seq 1 20); do
              test -f "$UI_SNAPSHOT_ROOT/window-id" && break
              sleep 1
            done
            test -f "$UI_SNAPSHOT_ROOT/window-id"
            screencapture -x -o -l "$(cat "$UI_SNAPSHOT_ROOT/window-id")" "artifacts/screenshots/$state.png"
            kill "$pid"
            wait "$pid" || true
          done
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          log show --last 5m --style compact --predicate 'process == "OpenWorldManager" OR process == "open-world-tile-server"' > artifacts/macos.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-installer-${{ matrix.rid }}
          path: artifacts/
          retention-days: 14

