[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kc-world-builder"
version = "0.1.0"
description = "Fixture-friendly data compiler for the KC two-tile prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
geo = ["pyproj>=3.6"]
full = ["pyarrow>=14", "pyproj>=3.6"]

[project.scripts]
kc-world-builder = "kc_world_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
