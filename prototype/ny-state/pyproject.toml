[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ny-world-milestone-zero"
version = "0.1.0"
description = "Throwaway New York State grid and LODES inventory prototype"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "numpy>=2.0",
  "pyproj>=3.6",
  "scipy>=1.14",
  "shapely>=2.0",
]

[project.scripts]
ny-world-m0 = "ny_world_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
