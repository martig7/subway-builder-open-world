[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nec-world-builder"
version = "0.1.0"
description = "Northeast Corridor tile selection and LODES demand prototype"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "pyproj>=3.6",
  "shapely>=2.0",
]

[project.scripts]
nec-world = "nec_world_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
