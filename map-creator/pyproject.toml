[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-world-map-creator"
version = "1.0.0"
description = "Centralized, resumable map and demand artifact creator for Open World mods"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
routing = ["numpy>=1.26", "pyproj>=3.6", "scipy>=1.12", "shapely>=2.0"]
ferries = ["osmium>=4.0"]
geometry = ["pyshp>=2.3,<3", "osmium>=4.0", "shapely>=2.1", "pyproj>=3.6"]
japan = ["numpy>=1.26", "openpyxl>=3.1", "pypdf>=6,<7", "pyproj>=3.6", "pyshp>=2.3,<3", "shapely>=2.0", "xlrd>=2.0,<3"]
building-supplements = ["mapbox-vector-tile>=2.2", "pmtiles>=3.7", "requests>=2.31", "shapely>=2.1"]
label-audit = ["mapbox-vector-tile>=2.2", "pmtiles>=3.7", "osmium>=4.0"]
label-publication = ["mapbox-vector-tile>=2.2", "pmtiles>=3.7", "pykakasi==2.3.0"]
building-boundaries = ["numpy>=1.26", "shapely>=2.1", "mapbox-vector-tile>=2.2", "pmtiles>=3.7"]
landuse-audit = ["mapbox-vector-tile>=2.2", "pmtiles>=3.7"]
vegetation = ["rasterio==1.4.3", "shapely==2.1.2", "pillow>=12", "requests>=2.31", "numpy>=1.26"]
test = []

[project.scripts]
ow-map = "open_world_map_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/open-world/contracts" = ["../open-world-platform/contracts/world-definition.schema.json"]
